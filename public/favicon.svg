<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <radialGradient id="sky" cx="50%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#FFE4A0"></stop>
      <stop offset="55%" stop-color="#FBBF60"></stop>
      <stop offset="100%" stop-color="#E87830"></stop>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0"></stop>
      <stop offset="40%" stop-color="#FFD040"></stop>
      <stop offset="100%" stop-color="#F57C00"></stop>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD040" stop-opacity="0.5"></stop>
      <stop offset="100%" stop-color="#F57C00" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3AACBE"></stop>
      <stop offset="100%" stop-color="#1A7A90"></stop>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C870"></stop>
      <stop offset="100%" stop-color="#C8A850"></stop>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5028"></stop>
      <stop offset="100%" stop-color="#A07040"></stop>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DC6A"></stop>
      <stop offset="100%" stop-color="#D4B840"></stop>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0392B"></stop>
      <stop offset="100%" stop-color="#8B1A10"></stop>
    </linearGradient>
    <clipPath id="round">
      <rect width="32" height="32" rx="7"></rect>
    </clipPath>
  </defs><g clip-path="url(#round)">
    <!-- Sky -->
    <rect width="32" height="32" fill="url(#sky)"></rect>

    <!-- Sun glow halo -->
    <circle cx="16" cy="15" r="11" fill="url(#sunGlow)"></circle>
    <!-- Sun disc -->
    <circle cx="16" cy="15" r="6.5" fill="url(#sun)"></circle>
    <!-- Sun inner highlight -->
    <circle cx="14.5" cy="13.5" r="1.8" fill="#FFF8D0" opacity="0.45"></circle>

    <!-- Sea -->
    <rect x="0" y="21" width="32" height="11" fill="url(#sea)"></rect>
    <!-- Sea shimmer -->
    <rect x="4" y="22.5" width="8" height="0.7" rx="0.35" fill="white" opacity="0.25"></rect>
    <rect x="18" y="23.8" width="6" height="0.6" rx="0.3" fill="white" opacity="0.2"></rect>

    <!-- Sand strip -->
    <rect x="0" y="20" width="32" height="4" fill="url(#sand)"></rect>

    <!-- Palm trunk — gently curved -->
    <path d="M9 32 Q9.5 26 10.5 22 Q11 19.5 11.8 17.5" stroke="url(#trunk)" stroke-width="1.6" fill="none" stroke-linecap="round"></path>

    <!-- Palm fronds — layered with depth -->
    <path d="M11.8 17.5 Q6.5 15 4 16.5" stroke="#1A6B30" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"></path>
    <path d="M11.8 17.5 Q7.5 14 7 11" stroke="#1A6B30" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"></path>
    <path d="M11.8 17.5 Q10.5 13 12 10.5" stroke="#2E8B44" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
    <path d="M11.8 17.5 Q14 13 16.5 12" stroke="#2E8B44" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
    <path d="M11.8 17.5 Q15 15.5 17.5 14.5" stroke="#37A050" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.9"></path>

    <!-- House body -->
    <rect x="18.5" y="16.5" width="9" height="7" rx="0.5" fill="url(#house)"></rect>
    <!-- House shadow side -->
    <rect x="25.5" y="16.5" width="2" height="7" rx="0.5" fill="#B89A28" opacity="0.4"></rect>
    <!-- Roof -->
    <path d="M17.5 16.5 L23 12 L28.5 16.5 Z" fill="url(#roof)"></path>
    <!-- Roof ridge highlight -->
    <path d="M17.8 16.5 L23 12.4 L28.2 16.5" stroke="#E05040" stroke-width="0.4" fill="none" opacity="0.6"></path>
    <!-- Door arch -->
    <path d="M21.5 23.5 L21.5 20.5 Q23 19 24.5 20.5 L24.5 23.5 Z" fill="#7A3C10"></path>
    <!-- Window left -->
    <rect x="19.5" y="18" width="1.5" height="1.5" rx="0.3" fill="#C8E8F8" opacity="0.9"></rect>
    <!-- Window right -->
    <rect x="25.5" y="18" width="1.5" height="1.5" rx="0.3" fill="#C8E8F8" opacity="0.9"></rect>
  </g></svg>